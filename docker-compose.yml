# ⚠️ VPS THỰC TẾ chỉ có 2 vCPU / ~1.9GB RAM, và ĐANG CHẠY CHUNG với 1 stack production khác
# (Java app + mysql + minio, không thuộc file này) chiếm sẵn ~1.1GB — RAM còn trống thực sự
# chỉ ~891Mi (`free -h` → cột available). Ngân sách bên dưới đã ép xuống mức tối thiểu để CÓ
# THỂ start được trên phần cứng này, KHÔNG phải mức khuyến nghị — torch/transformers/
# sentence-transformers vẫn có nguy cơ thật bị OOM-kill khi tải model hoặc lúc có traffic
# đồng thời. Nếu container app bị kill giữa chừng: `docker inspect pancharm-app | grep -i
# OOMKilled` để xác nhận, và cân nhắc nâng cấp VPS lên tối thiểu 4 vCPU/6-8GB dành riêng thay
# vì tiếp tục ép chung với stack cũ. Chỉ 3 service: app + mysql + redis-stack. Postgres/Kafka/
# MinIO KHÔNG có mặt ở đây — Postgres đã gỡ khỏi codebase (không dùng), Kafka là optional (app
# tự fallback sang xử lý trực tiếp nếu KAFKA_BOOTSTRAP_SERVERS rỗng — xem main.py lifespan),
# MinIO chưa có code nào thực sự dùng nên không tốn RAM cho nó. ChromaDB chạy embedded trong
# chính container app (persistent client trên thư mục chroma_db), không phải service riêng.
#
# Ngân sách tài nguyên (ép tối thiểu, không phải mức thoải mái):
#   app          : 1.0 vCPU / 900MB  (nặng nhất — FastAPI + torch + sentence-transformers)
#   mysql        : 0.6 vCPU / 400MB
#   redis-stack  : 0.4 vCPU / 200MB
#   ------------------------------------------------------------------
#   tổng cấp phát : 2.0 / 2.0 vCPU, 1.5GB / ~1.9GB total (không còn buffer cho host/stack cũ —
#   cpus limit ở đây chỉ là TRẦN cho từng container, không phải phần dành riêng: vẫn phải
#   tranh chấp 2 vCPU thật với stack production cũ đang chạy song song, không có gì đảm bảo)
#
# Docker mặc định cho phép container swap tới 2x memory limit khi memory-swap không set —
# tận dụng ~3GB swap còn trống trên host làm lớp đệm trước khi bị OOM-kill hẳn, đổi lấy độ
# trễ cao hơn nhiều lúc container phải swap (đặc biệt lúc pre-warm graph/tải embedding model).
#
# Yêu cầu Docker Compose V2 (lệnh `docker compose`, không phải `docker-compose` v1) để
# deploy.resources.limits có tác dụng khi chạy ngoài Swarm.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pancharm-mas:latest
    container_name: pancharm-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports:
      # Chỉ bind localhost — Nginx trên host proxy vào đây, không expose thẳng ra internet.
      - "127.0.0.1:8088:8088"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./logs:/app/logs
      # Bắt buộc — không mount thì file migration sinh ra bởi `alembic revision
      # --autogenerate` chỉ tồn tại trong writable layer của container tạm (`docker compose
      # run --rm`), biến mất ngay khi container bị xoá do --rm. Mount ra host để file persist
      # và commit được vào git (xem resources/setup/4_data-seed-migrate.md mục 4.3).
      - ./alembic/versions:/app/alembic/versions
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 900m
        reservations:
          memory: 500m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      # 180s (không phải 90s) — dưới áp lực RAM, cold start (load torch + embedding model +
      # compile LangGraph graph) có thể phải swap, chậm hơn nhiều so với RAM dư dả.
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mysql:
    image: mysql:8.0
    container_name: pancharm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      # innodb-buffer-pool-size + max-connections ép rất thấp vì mem_limit của service này
      # chỉ 400MB (VPS chỉ ~1.9GB RAM, xem ghi chú đầu file) — DB_POOL_SIZE=10 +
      # DB_MAX_OVERFLOW=20 (core/config.py) chỉ cần tối đa 30 connection từ app, 40 chừa dư
      # cho alembic/truy cập thủ công.
      - --innodb-buffer-pool-size=96M
      - --max-connections=40
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 3307 (không phải 3306 mặc định) — VPS này đã có sẵn 1 container MySQL khác (project
      # production riêng) chiếm cứng host port 3306. App vẫn kết nối qua tên service nội bộ
      # "mysql:3306" trong network Docker (không đụng port host này) — port 3307 chỉ để tiện
      # truy cập từ host (mysql client, backup) khi cần, không ảnh hưởng tới container-to-
      # container traffic.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 400m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis/redis-stack-server:latest
    container_name: pancharm-redis
    restart: unless-stopped
    environment:
      # maxmemory 96mb (không phải 768mb) — chừa ~100MB trong memory limit 200m cho overhead
      # process/module của redis-stack-server (RediSearch/RedisJSON) trước khi chạm limit.
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD} --maxmemory 96mb --maxmemory-policy noeviction"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 200m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql_data:
  redis_data:
